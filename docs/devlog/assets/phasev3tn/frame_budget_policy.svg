<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Phase V3T-N frame budget policy</title>
  <desc id="desc">Candidate Performanceの現在値20.90ミリ秒と、45 FPSおよび30 FPS予算までの余裕</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15110e"/><stop offset="1" stop-color="#2a1710"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f7b85a"/><stop offset="1" stop-color="#ff6b3d"/></linearGradient></defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="72" y="86" fill="#f7b85a" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" letter-spacing="3">PHASE V3T-N · FRAME BUDGET</text>
  <text x="72" y="145" fill="#fff4e8" font-family="Segoe UI, sans-serif" font-size="44" font-weight="700">45 FPSを通常目標、30 FPSを最低ラインにする</text>
  <text x="72" y="190" fill="#c8b7a8" font-family="Segoe UI, sans-serif" font-size="23">Candidate Performance · production-equivalent Flow volume · average visible render counter</text>
  <rect x="72" y="248" width="1136" height="72" rx="16" fill="#3a2b22"/>
  <rect x="72" y="248" width="712" height="72" rx="16" fill="url(#bar)"/>
  <line x1="829" y1="232" x2="829" y2="336" stroke="#ffe0a6" stroke-width="4"/>
  <line x1="1208" y1="232" x2="1208" y2="336" stroke="#d8d0c8" stroke-width="4"/>
  <text x="92" y="294" fill="#23140d" font-family="Segoe UI, sans-serif" font-size="28" font-weight="800">CURRENT 20.90 ms · 47.858 FPS</text>
  <text x="804" y="365" fill="#ffe0a6" font-family="Segoe UI, sans-serif" font-size="20" text-anchor="middle">22.222 ms · 45 FPS</text>
  <text x="1208" y="365" fill="#d8d0c8" font-family="Segoe UI, sans-serif" font-size="20" text-anchor="end">33.333 ms · 30 FPS</text>
  <g font-family="Segoe UI, sans-serif"><rect x="72" y="414" width="535" height="166" rx="20" fill="#241d18" stroke="#684a37"/><text x="104" y="464" fill="#f7b85a" font-size="20" font-weight="700">NORMAL TARGET MARGIN</text><text x="104" y="530" fill="#fff4e8" font-size="54" font-weight="800">1.322 ms</text><text x="104" y="558" fill="#b9aa9e" font-size="18">future visual features must share this tight target budget</text><rect x="633" y="414" width="575" height="166" rx="20" fill="#241d18" stroke="#684a37"/><text x="665" y="464" fill="#f7b85a" font-size="20" font-weight="700">MINIMUM-LINE MARGIN</text><text x="665" y="530" fill="#fff4e8" font-size="54" font-weight="800">12.433 ms</text><text x="665" y="558" fill="#b9aa9e" font-size="18">not raw latency · not display-present FPS</text></g>
  <text x="72" y="640" fill="#d2c4b8" font-family="Segoe UI, sans-serif" font-size="22">High-cost observers: decouple · threshold · lower frequency · interpolate</text>
  <text x="72" y="676" fill="#9d8f84" font-family="Segoe UI, sans-serif" font-size="18">60 FPS / 16.667 ms remains a light-scene ideal; historical gates are preserved.</text>
</svg>

