<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Phase V3M-C dynamic Mesh performance</title><desc id="desc">Twenty logs and 7200 surface cells at a five hertz target. Functional gates pass but the one millisecond publication target does not.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#251238"/></linearGradient></defs>
<rect width="1200" height="680" rx="28" fill="url(#bg)"/><text x="64" y="62" fill="#67e8f9" font-family="Segoe UI,sans-serif" font-size="18" font-weight="700">PHASE V3M-C · 20 LOGS · 7,200 SURFACE CELLS · RGBA8 × 2</text>
<text x="64" y="118" fill="#f8fafc" font-family="Segoe UI,sans-serif" font-size="36" font-weight="750">The fixed transport works; the 1 ms budget does not</text>
<text x="64" y="158" fill="#cbd5e1" font-family="Segoe UI,sans-serif" font-size="18">100 post-warmup samples · CPU raw upload · one revision Set · feature remains default OFF</text>
<g font-family="Segoe UI,sans-serif"><rect x="64" y="210" width="1072" height="78" rx="16" fill="#172554"/><text x="88" y="242" fill="#bfdbfe" font-size="17">V2 native extraction p95</text><rect x="390" y="232" width="82.7" height="22" rx="11" fill="#38bdf8"/><text x="1090" y="252" text-anchor="end" fill="#f8fafc" font-size="24" font-weight="700">0.7880 ms</text>
<rect x="64" y="306" width="1072" height="78" rx="16" fill="#172554"/><text x="88" y="338" fill="#bfdbfe" font-size="17">Beauty atlas pack p95</text><rect x="390" y="328" width="291.6" height="22" rx="11" fill="#a78bfa"/><text x="1090" y="348" text-anchor="end" fill="#f8fafc" font-size="24" font-weight="700">2.7769 ms</text>
<rect x="64" y="402" width="1072" height="78" rx="16" fill="#172554"/><text x="88" y="434" fill="#bfdbfe" font-size="17">CPU texture upload p95</text><rect x="390" y="424" width="260.1" height="22" rx="11" fill="#f59e0b"/><text x="1090" y="444" text-anchor="end" fill="#f8fafc" font-size="24" font-weight="700">2.4774 ms</text>
<rect x="64" y="498" width="1072" height="94" rx="16" fill="#3f1d2e" stroke="#fb7185" stroke-width="2"/><text x="88" y="535" fill="#fecdd3" font-size="18">Visual publication total p95</text><rect x="390" y="525" width="568.4" height="24" rx="12" fill="#fb7185"/><text x="1090" y="550" text-anchor="end" fill="#fff1f2" font-size="28" font-weight="800">5.4135 ms</text><text x="88" y="574" fill="#fecdd3" font-size="15">reference 1.0000 ms · 921,600 bytes/revision · target missed</text></g>
<text x="64" y="640" fill="#94a3b8" font-family="Segoe UI,sans-serif" font-size="16">Functional 17/17 · reload + rollback + no-op + stable topology · GPU upload unqualified · production default unchanged</text></svg>
