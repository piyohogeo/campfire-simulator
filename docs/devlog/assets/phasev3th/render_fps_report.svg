<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img"><style>.k{font:700 17px Segoe UI,sans-serif;fill:#7dd3fc;letter-spacing:2px}.title{font:700 36px Segoe UI,sans-serif;fill:#f8fafc}.sub{font:16px Segoe UI,sans-serif;fill:#a7b2c2}.label{font:700 17px Segoe UI,sans-serif;fill:#f8fafc}.fps{font:700 27px Segoe UI,sans-serif;fill:#f8fafc}.value{font:15px Segoe UI,sans-serif;fill:#cbd5e1;text-anchor:end}.note{font:16px Segoe UI,sans-serif;fill:#fbbf24}</style><rect width="1200" height="690" rx="28" fill="#0b1625"/><text x="72" y="62" class="k">PHASE V3T-H / VISIBLE VIEWPORT</text><text x="72" y="112" class="title">Average render FPS without an extra render path</text><text x="72" y="148" class="sub">20 logs / 1280 x 720 / 30 s warmup + 60 s measurement / 3 rotated runs</text><text x="72" y="225" class="label">Flow OFF / V3 OFF</text><text x="72" y="259" class="fps">33.01 FPS</text><rect x="365" y="198" width="330.1" height="44" rx="10" fill="#38bdf8"/><text x="1035" y="229" class="value">HUD mean 32.87 FPS</text><text x="72" y="350" class="label">Flow ON / V3 OFF</text><text x="72" y="384" class="fps">22.34 FPS</text><rect x="365" y="323" width="223.4" height="44" rx="10" fill="#f59e0b"/><text x="1035" y="354" class="value">HUD mean 22.28 FPS</text><text x="72" y="475" class="label">Flow ON / V3 CPU</text><text x="72" y="509" class="fps">23.10 FPS</text><rect x="365" y="448" width="231.0" height="44" rx="10" fill="#ef4444"/><text x="1035" y="479" class="value">HUD mean 23.13 FPS</text><text x="72" y="615" class="note">No raw visible-frame timestamps: render p95/p99 and 1% low are intentionally not reported.</text><text x="72" y="650" class="sub">Frame-counter delta / wall time; HUD mean is the public smoothed FPS source. Display-present FPS remains unmeasured.</text></svg>