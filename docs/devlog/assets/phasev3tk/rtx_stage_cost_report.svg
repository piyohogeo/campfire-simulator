<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="850" viewBox="0 0 1260 850" role="img" aria-labelledby="title desc">
<title id="title">Phase V3T-K RTX stage and AA cost isolation</title>
<desc id="desc">Average visible viewport FPS for staged scene additions and DLSS modes at 1280 by 720, RTX 3090, 210 watt power limit.</desc>
<rect width="1260" height="850" rx="28" fill="#08111f"/><style>.k{font:700 15px system-ui;fill:#7dd3fc;letter-spacing:2px}.t{font:700 32px system-ui;fill:#f8fafc}.s{font:15px system-ui;fill:#94a3b8}.label{font:14px system-ui;fill:#dbeafe}.value{font:700 14px system-ui;fill:#f8fafc}.aa{font:12px system-ui;fill:#c4b5fd}.aaValue{font:700 13px system-ui;fill:#f8fafc}</style>
<text x="55" y="48" class="k">PHASE V3T-K · PRODUCTION-NEUTRAL VISIBLE VIEWPORT</text><text x="55" y="91" class="t">The 32 FPS boundary is cumulative, not V3 Mesh alone</text>
<text x="55" y="120" class="s">Kit 110.2 · Flow 110.0.0 · RTX 3090 · 1280×720 · 210 W · DLSS Auto for stage matrix · 3 independent runs</text>
<text x="55" y="178" class="label">Empty RTX</text><rect x="250" y="160" width="636.8" height="27" rx="7" fill="#38bdf8"/><text x="896.8" y="179" class="value">101.52</text><text x="55" y="221" class="label">Ground + stones</text><rect x="250" y="203" width="360.5" height="27" rx="7" fill="#38bdf8"/><text x="620.5" y="222" class="value">57.47</text><text x="55" y="264" class="label">+ lights</text><rect x="250" y="246" width="344.6" height="27" rx="7" fill="#38bdf8"/><text x="604.6" y="265" class="value">54.94</text><text x="55" y="307" class="label">20 cylinders</text><rect x="250" y="289" width="288.7" height="27" rx="7" fill="#38bdf8"/><text x="548.7" y="308" class="value">46.02</text><text x="55" y="350" class="label">V3 mesh / solid</text><rect x="250" y="332" width="289.4" height="27" rx="7" fill="#38bdf8"/><text x="549.4" y="351" class="value">46.14</text><text x="55" y="393" class="label">+ fixed texture</text><rect x="250" y="375" width="285.6" height="27" rx="7" fill="#38bdf8"/><text x="545.6" y="394" class="value">45.54</text><text x="55" y="436" class="label">+ dynamic URI</text><rect x="250" y="418" width="280.9" height="27" rx="7" fill="#38bdf8"/><text x="540.9" y="437" class="value">44.78</text><text x="55" y="479" class="label">+ rigid / stopped</text><rect x="250" y="461" width="280.9" height="27" rx="7" fill="#38bdf8"/><text x="540.9" y="480" class="value">44.77</text><text x="55" y="522" class="label">+ timeline PLAY</text><rect x="250" y="504" width="227.3" height="27" rx="7" fill="#38bdf8"/><text x="487.3" y="523" class="value">36.23</text><text x="55" y="565" class="label">+ Flow authored / all OFF</text><rect x="250" y="547" width="277.5" height="27" rx="7" fill="#f59e0b"/><text x="537.5" y="566" class="value">44.25</text><text x="55" y="608" class="label">+ Flow global OFF / active</text><rect x="250" y="590" width="197.5" height="27" rx="7" fill="#f59e0b"/><text x="457.5" y="609" class="value">31.48</text><text x="55" y="651" class="label">+ Flow simulation</text><rect x="250" y="633" width="153.8" height="27" rx="7" fill="#f59e0b"/><text x="413.8" y="652" class="value">24.52</text><text x="55" y="694" class="label">+ volume render</text><rect x="250" y="676" width="153.8" height="27" rx="7" fill="#f59e0b"/><text x="413.8" y="695" class="value">24.52</text>
<line x1="760" y1="560" x2="760" y2="815" stroke="#334155"/><text x="800" y="590" class="k">GLOBAL FLOW OFF · ACTIVE SUBTREE · AA</text>
<text x="800" y="620" class="s">Performance nears 60 FPS; Auto and DLAA stay near 31 FPS.</text>
<line x1="790" y1="775" x2="1200" y2="775" stroke="#64748b"/><rect x="800" y="655.4" width="92" height="119.6" rx="7" fill="#a78bfa"/><text x="846" y="646.4" class="aaValue" text-anchor="middle">59.81</text><text x="846" y="803" class="aa" text-anchor="middle">performance</text><rect x="935" y="712.7" width="92" height="62.3" rx="7" fill="#a78bfa"/><text x="981" y="703.7" class="aaValue" text-anchor="middle">31.16</text><text x="981" y="803" class="aa" text-anchor="middle">auto</text><rect x="1070" y="712.7" width="92" height="62.3" rx="7" fill="#a78bfa"/><text x="1116" y="703.7" class="aaValue" text-anchor="middle">31.13</text><text x="1116" y="803" class="aa" text-anchor="middle">dlaa</text>
