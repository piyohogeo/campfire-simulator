<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Phase 6DD USD notice and change-processing boundary</title><desc id="desc">Live Flow stage ChangeBlock exit is compared with this diagnostic callback and isolated USD attribute groups. The contrast is not a direct Flow ingest timer.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13253a"/><stop offset="1" stop-color="#2f1d2e"/></linearGradient></defs><style>.k{font:700 17px 'Segoe UI',sans-serif;fill:#93c5fd;letter-spacing:2px}.title{font:750 35px 'Segoe UI',sans-serif;fill:#f8fafc}.sub{font:16px 'Segoe UI',sans-serif;fill:#cbd5e1}.label{font:650 16px 'Segoe UI',sans-serif;fill:#e2e8f0}.value{font:700 16px 'Segoe UI',sans-serif;fill:#f8fafc}.good{font:750 22px 'Segoe UI',sans-serif;fill:#86efac}.warn{font:650 16px 'Segoe UI',sans-serif;fill:#fbbf24}.note{font:14px 'Segoe UI',sans-serif;fill:#94a3b8}</style>
<rect width="1200" height="680" rx="30" fill="url(#bg)"/><text x="64" y="61" class="k">PHASE 6DD · NOTICE / CHANGE PROCESSING</text><text x="64" y="111" class="title">The observed callback is not the 1 ms boundary</text><text x="64" y="150" class="sub">Flow 110.0.0 · 720 points · one coalesced notice per snapshot · default OFF</text>
<rect x="56" y="188" width="1088" height="367" rx="20" fill="#0f2032"/><text x="80" y="254" class="label">Live layout snapshots (6 Sets): exit</text><rect x="390" y="232" width="555.00" height="28" rx="7" fill="#fb923c"/><text x="970" y="254" class="value">1.4380 ms p95</text><text x="80" y="315" class="label">Live channel snapshots (4 Sets): exit</text><rect x="390" y="293" width="371.40" height="28" rx="7" fill="#fbbf24"/><text x="970" y="315" class="value">0.9623 ms p95</text><text x="80" y="376" class="label">Live layout snapshots: our callback</text><rect x="390" y="354" width="58.20" height="28" rx="7" fill="#38bdf8"/><text x="970" y="376" class="value">0.1508 ms p95</text><text x="80" y="437" class="label">Isolated 6 attrs: no listener</text><rect x="390" y="415" width="2.74" height="28" rx="7" fill="#86efac"/><text x="970" y="437" class="value">0.0071 ms p95</text><text x="80" y="498" class="label">Isolated 6 attrs: one listener</text><rect x="390" y="476" width="4.32" height="28" rx="7" fill="#4ade80"/><text x="970" y="498" class="value">0.0112 ms p95</text>
<text x="64" y="594" class="good">12 / 12 gates · 60 layout + 700 channel snapshot notices</text><text x="64" y="626" class="warn">Set-call count and notice changed-path count are different; do not assign the live contrast to Flow.</text><text x="64" y="654" class="note">Live exit includes synchronous USD change processing and every subscriber; our callback measures only path enumeration. Production contracts and Flow version are unchanged.</text></svg>