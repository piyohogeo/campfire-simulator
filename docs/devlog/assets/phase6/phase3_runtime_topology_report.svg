<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Phase 6AF runtime topology decision</title><desc id="desc">Three alternating pairs compare dynamic topology reads with an explicit snapshot.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient></defs><style>.title{font:750 38px 'Segoe UI',sans-serif;fill:#f8fafc}.kicker{font:700 17px 'Segoe UI',sans-serif;fill:#60a5fa;letter-spacing:2px}.sub{font:16px 'Segoe UI',sans-serif;fill:#cbd5e1}.heading{font:700 16px 'Segoe UI',sans-serif;fill:#f8fafc}.value{font:750 28px 'Segoe UI',sans-serif;fill:#93c5fd}.small{font:14px 'Segoe UI',sans-serif;fill:#94a3b8}.decision{font:750 24px 'Segoe UI',sans-serif;fill:#fca5a5}</style><rect width="1200" height="680" rx="30" fill="url(#bg)"/><text x="64" y="64" class="kicker">PHASE 6AF - STATIC TOPOLOGY AUDIT</text><text x="64" y="114" class="title">Snapshot only after topology configuration</text><text x="64" y="148" class="sub">Public mutability preserved - 3 alternating pairs - exact state and CSV equivalence</text><rect x="64" y="188" width="336" height="292" rx="22" fill="#172033" stroke="#2563eb"/><text x="92" y="230" class="heading">METRICS AGGREGATION</text><text x="92" y="280" class="value">12.59% faster</text><text x="92" y="316" class="sub">0.3320 to 0.2902 ms</text><rect x="432" y="188" width="336" height="292" rx="22" fill="#172033" stroke="#2563eb"/><text x="460" y="230" class="heading">WOOD VISUAL UPDATE</text><text x="460" y="280" class="value">35.06% faster</text><text x="460" y="316" class="sub">0.8605 to 0.5588 ms</text><rect x="800" y="188" width="336" height="292" rx="22" fill="#172033" stroke="#2563eb"/><text x="828" y="230" class="heading">SCENARIO WALL TIME</text><text x="828" y="280" class="value">1.15% slower</text><text x="828" y="316" class="sub">10.9577 to 11.0834 s</text><text x="92" y="374" class="small">No per-cell surface predicate</text><text x="92" y="402" class="small">Ordered surface references retained</text><text x="460" y="374" class="small">Initial dry-mass baseline cached</text><text x="460" y="402" class="small">Default visual API remains dynamic</text><text x="828" y="374" class="small">Step loop: -1.14%</text><text x="828" y="402" class="small">0 / 3 pairs improve loop + scenario</text><rect x="64" y="522" width="1072" height="94" rx="18" fill="#111c34" stroke="#fca5a5" stroke-width="2"/><text x="92" y="566" class="decision">REJECTED - keep dynamic topology reads</text><text x="92" y="594" class="sub">Constructor caching rejected: calibration legitimately edits surface metadata after model creation.</text><text x="64" y="654" class="small">Adoption requires metrics, visual, step-loop, scenario medians and paired repeatability to improve.</text></svg>
