<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Phase 6AC conditional state-clamp decision</title>
  <desc id="desc">3 alternating pairs compare built-in min/max clamps with equivalent conditional comparisons.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#25160d"/></linearGradient></defs>
  <style>.title{font:750 38px 'Segoe UI',sans-serif;fill:#f8fafc}.kicker{font:700 17px 'Segoe UI',sans-serif;fill:#fb923c;letter-spacing:2px}.sub{font:16px 'Segoe UI',sans-serif;fill:#cbd5e1}.heading{font:700 16px 'Segoe UI',sans-serif;fill:#f8fafc}.value{font:750 28px 'Segoe UI',sans-serif;fill:#fdba74}.small{font:14px 'Segoe UI',sans-serif;fill:#94a3b8}.decision{font:750 24px 'Segoe UI',sans-serif;fill:#86efac}</style>
  <rect width="1200" height="680" rx="30" fill="url(#bg)"/>
  <text x="64" y="64" class="kicker">PHASE 6AC · CONDITIONAL STATE CLAMPS</text>
  <text x="64" y="114" class="title">Keep every bound, avoid common-path calls</text>
  <text x="64" y="148" class="sub">3 alternating pairs · debugger-free Phase 3 · NaN and −0.0 behavior preserved</text>
  <rect x="64" y="188" width="336" height="292" rx="22" fill="#2a1d16" stroke="#c2410c"/>
  <text x="92" y="230" class="heading">PROFILED STATE FINALIZE</text>
  <text x="92" y="280" class="value">76.69% faster</text>
  <text x="92" y="316" class="sub">3.6813 → 0.8582 ms</text>
  <text x="92" y="374" class="small">Temperature bounds retained</text>
  <text x="92" y="402" class="small">Four mass bounds retained</text>
  <text x="92" y="430" class="small">Diagnostic counters disabled</text>
  <rect x="432" y="188" width="336" height="292" rx="22" fill="#2a1d16" stroke="#c2410c"/>
  <text x="460" y="230" class="heading">UNPROFILED WOOD STEP</text>
  <text x="460" y="280" class="value">20.40% faster</text>
  <text x="460" y="316" class="sub">10.3717 → 8.2559 ms</text>
  <text x="460" y="374" class="small">Median of 3 runs per path</text>
  <text x="460" y="402" class="small">No internal timers</text>
  <text x="460" y="430" class="small">Exact authoritative outputs</text>
  <rect x="800" y="188" width="336" height="292" rx="22" fill="#2a1d16" stroke="#c2410c"/>
  <text x="828" y="230" class="heading">SCENARIO WALL TIME</text>
  <text x="828" y="280" class="value">14.14% faster</text>
  <text x="828" y="316" class="sub">16.4571 → 14.1304 s</text>
  <text x="828" y="374" class="small">Flow and 2 captures retained</text>
  <text x="828" y="402" class="small">3 / 3 pairs improve both</text>
  <text x="828" y="430" class="small">Debugger extensions: 0</text>
  <rect x="64" y="522" width="1072" height="94" rx="18" fill="#251a14" stroke="#86efac" stroke-width="2"/>
  <text x="92" y="566" class="decision">ADOPTED · enable conditional clamp path</text>
  <text x="92" y="594" class="sub">Equations, grid, dt, cell order, state SHA-256, CSV SHA-256, and ignition remain unchanged.</text>
  <text x="64" y="654" class="small">Profile timing identifies the affected segment; only unprofiled end-to-end timing drives adoption.</text>
</svg>
