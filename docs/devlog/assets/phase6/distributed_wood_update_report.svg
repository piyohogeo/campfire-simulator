<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Phase 6AR distributed five-hertz wood-update trial</title>
  <desc id="desc">Twenty logs are assigned to twelve deterministic frame slots while exact dormant logs skip full solver work.</desc>
  <style>.title{font:750 34px 'Segoe UI',sans-serif;fill:#f8fafc}.kicker{font:700 16px 'Segoe UI',sans-serif;fill:#fda4af;letter-spacing:2px}.sub{font:15px 'Segoe UI',sans-serif;fill:#cbd5e1}.count{font:750 18px 'Segoe UI',sans-serif;fill:#f8fafc}.sleep{font:14px 'Segoe UI',sans-serif;fill:#94a3b8}.value{font:650 14px 'Segoe UI',sans-serif;fill:#f8fafc}.small{font:13px 'Segoe UI',sans-serif;fill:#94a3b8}.decision{font:750 20px 'Segoe UI',sans-serif;fill:#fde68a}</style>
  <rect width="1200" height="680" rx="30" fill="#111827"/>
  <text x="58" y="56" class="kicker">PHASE 6AR - DISTRIBUTED 5 HZ TRIAL</text>
  <text x="58" y="102" class="title">Spread fixed steps; sleep only exact equilibrium</text>
  <text x="58" y="136" class="sub">20 logs · 12 deterministic frame slots · 3 balanced runs/activity · exact snapshotted inputs</text>
  <rect x="42" y="164" width="1116" height="390" rx="20" fill="#142033" stroke="#334155"/>
  <line x1="677.6" y1="184" x2="677.6" y2="525" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="687.6" y="181" class="value">4 ms p95 budget</text>
  <text x="70" y="224" class="count">2 active</text><text x="184" y="224" class="sleep">18 sleeping</text><rect x="370" y="205" width="221.9" height="28" rx="14" fill="#334155"/><rect x="370" y="210" width="39.3" height="18" rx="9" fill="#22c55e"/><text x="603.9" y="224" class="value">mean 0.511 · p95 2.885 ms</text><text x="70" y="292" class="count">5 active</text><text x="184" y="292" class="sleep">15 sleeping</text><rect x="370" y="273" width="291.5" height="28" rx="14" fill="#334155"/><rect x="370" y="278" width="94.3" height="18" rx="9" fill="#22c55e"/><text x="673.5" y="292" class="value">mean 1.227 · p95 3.790 ms</text><text x="70" y="360" class="count">10 active</text><text x="184" y="360" class="sleep">10 sleeping</text><rect x="370" y="341" width="301.1" height="28" rx="14" fill="#334155"/><rect x="370" y="346" width="172.5" height="18" rx="9" fill="#22c55e"/><text x="683.1" y="360" class="value">mean 2.243 · p95 3.916 ms</text><text x="70" y="428" class="count">12 active</text><text x="184" y="428" class="sleep">8 sleeping</text><rect x="370" y="409" width="303.9" height="28" rx="14" fill="#334155"/><rect x="370" y="414" width="207.6" height="18" rx="9" fill="#22c55e"/><text x="685.9" y="428" class="value">mean 2.700 · p95 3.952 ms</text><text x="70" y="496" class="count">20 active</text><text x="184" y="496" class="sleep">0 sleeping</text><rect x="370" y="477" width="589.3" height="28" rx="14" fill="#334155"/><rect x="370" y="482" width="348.9" height="18" rx="9" fill="#fb7185"/><text x="971.3" y="496" class="value">mean 4.537 · p95 7.663 ms</text>
  <text x="58" y="598" class="decision">Measured p95 capacity: 12 active + 8 exact-sleeping logs</text>
  <text x="58" y="630" class="sub">Every final state matches the synchronous reference; production adoption remains blocked on app input/output latency.</text>
  <text x="58" y="657" class="small">Colored bar = mean; dark bar = p95. Full 20-log activity still requires native/GPU work or a finer scheduling boundary.</text>
</svg>
