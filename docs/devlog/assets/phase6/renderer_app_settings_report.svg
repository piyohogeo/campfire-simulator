<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Phase 6CT application settings boundary</title><desc id="desc">Matching the extension set and all fifteen allowlisted scalar settings differences does not remove the Campfire timeline stop. Fill viewport remains an unadopted workaround.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#4c1d95"/></linearGradient><style>.k{font:700 18px system-ui;fill:#c4b5fd;letter-spacing:2px}.t{font:700 35px system-ui;fill:#f8fafc}.s{font:19px system-ui;fill:#cbd5e1}.h{font:700 15px system-ui;fill:#ddd6fe}.cell{font:17px system-ui;fill:#e2e8f0}.good{font:700 20px system-ui;fill:#86efac}.bad{font:700 20px system-ui;fill:#fca5a5}.info{font:700 18px system-ui;fill:#93c5fd}.row{fill:#0f172a;stroke:#475569;stroke-width:1}.note{font:17px system-ui;fill:#ede9fe}</style></defs>
<rect width="1200" height="680" rx="30" fill="url(#bg)"/><text x="64" y="58" class="k">PHASE 6CT · APP SETTINGS BOUNDARY</text><text x="64" y="108" class="t">Matching extensions and 15 settings is not enough</text><text x="64" y="145" class="s">Flow 110 fixed · Camera + Cube · production unchanged · fixed capture retained</text>
<text x="84" y="184" class="h">TEST</text><text x="430" y="184" class="h">APPLICATION</text><text x="760" y="184" class="h">VIEWPORT</text><text x="970" y="184" class="h">RESULT</text><rect x="64" y="207" width="1072" height="44" rx="9" class="row"/><text x="84" y="238" class="cell">Matched extension set</text><text x="430" y="238" class="cell">Editor base</text><text x="760" y="238" class="cell">1280x720</text><text x="970" y="238" class="good">PLAY</text><rect x="64" y="261" width="1072" height="44" rx="9" class="row"/><text x="84" y="292" class="cell">15 scalar deltas found</text><text x="430" y="292" class="cell">Allowlisted settings</text><text x="760" y="292" class="cell">225 / 229</text><text x="970" y="292" class="info">BOUNDED</text><rect x="64" y="315" width="1072" height="44" rx="9" class="row"/><text x="84" y="346" class="cell">Run-loop group aligned</text><text x="430" y="346" class="cell">Campfire</text><text x="760" y="346" class="cell">1280x720</text><text x="970" y="346" class="bad">STOP</text><rect x="64" y="369" width="1072" height="44" rx="9" class="row"/><text x="84" y="400" class="cell">Viewport groups aligned</text><text x="430" y="400" class="cell">Campfire</text><text x="760" y="400" class="cell">1280x720</text><text x="970" y="400" class="bad">STOP</text><rect x="64" y="423" width="1072" height="44" rx="9" class="row"/><text x="84" y="454" class="cell">All 15 deltas aligned</text><text x="430" y="454" class="cell">Campfire</text><text x="760" y="454" class="cell">1280x720</text><text x="970" y="454" class="bad">STOP x2</text><rect x="64" y="477" width="1072" height="44" rx="9" class="row"/><text x="84" y="508" class="cell">fillViewport=true</text><text x="430" y="508" class="cell">Campfire</text><text x="760" y="508" class="cell">UI size</text><text x="970" y="508" class="good">PLAY</text>
<rect x="64" y="554" width="1072" height="78" rx="16" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="88" y="586" class="s">Remaining: app initialization order, viewport creation timing, or non-allowlisted internal state</text><text x="88" y="613" class="note">fillViewport=true remains unadopted because it breaks deterministic fixed-resolution capture.</text></svg>