<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Phase 6AI heat-capacity path decision</title>
  <desc id="desc">Three alternating pairs compare generic and constant-model heat-capacity evaluation.</desc>
  <style>.title{font:750 38px 'Segoe UI',sans-serif;fill:#f8fafc}.kicker{font:700 17px 'Segoe UI',sans-serif;fill:#fbbf24;letter-spacing:2px}.sub{font:16px 'Segoe UI',sans-serif;fill:#cbd5e1}.heading{font:700 16px 'Segoe UI',sans-serif;fill:#f8fafc}.value{font:750 28px 'Segoe UI',sans-serif;fill:#fde68a}.small{font:14px 'Segoe UI',sans-serif;fill:#94a3b8}.decision{font:750 24px 'Segoe UI',sans-serif;fill:#86efac}</style>
  <rect width="1200" height="680" rx="30" fill="#17130d"/>
  <text x="64" y="64" class="kicker">PHASE 6AI - HEAT CAPACITY FAST PATH</text>
  <text x="64" y="114" class="title">Specialize the common model, preserve mutable state</text>
  <text x="64" y="148" class="sub">3 alternating pairs - no cache - exact state, CSV, and ignition</text>
  <rect x="64" y="188" width="336" height="292" rx="22" fill="#272016" stroke="#a16207"/>
  <text x="92" y="230" class="heading">PROFILED HEAT CAPACITY</text>
  <text x="92" y="280" class="value">7.41% faster</text>
  <text x="92" y="316" class="sub">2.5936 to 2.4013 ms</text>
  <text x="92" y="374" class="small">Cell override read every call</text>
  <text x="92" y="402" class="small">Temperature validated every call</text>
  <text x="92" y="430" class="small">Nonconstant models fall back</text>
  <rect x="432" y="188" width="336" height="292" rx="22" fill="#272016" stroke="#a16207"/>
  <text x="460" y="230" class="heading">UNPROFILED WOOD STEP</text>
  <text x="460" y="280" class="value">7.00% faster</text>
  <text x="460" y="316" class="sub">6.0815 to 5.6559 ms</text>
  <text x="460" y="374" class="small">Median of 3 runs per path</text>
  <text x="460" y="402" class="small">No internal timers</text>
  <text x="460" y="430" class="small">Current adopted paths retained</text>
  <rect x="800" y="188" width="336" height="292" rx="22" fill="#272016" stroke="#a16207"/>
  <text x="828" y="230" class="heading">SCENARIO WALL TIME</text>
  <text x="828" y="280" class="value">5.27% faster</text>
  <text x="828" y="316" class="sub">10.1569 to 9.6215 s</text>
  <text x="828" y="374" class="small">Flow and two captures retained</text>
  <text x="828" y="402" class="small">3 / 3 pairs improve both</text>
  <text x="828" y="430" class="small">Debugger extensions: 0</text>
  <rect x="64" y="522" width="1072" height="94" rx="18" fill="#211b12" stroke="#86efac" stroke-width="2"/>
  <text x="92" y="566" class="decision">ADOPTED - enable constant-model path</text>
  <text x="92" y="594" class="sub">No equations, grid, time step, cell order, or public mutation semantics changed.</text>
  <text x="64" y="654" class="small">Profile timing locates the effect; unprofiled end-to-end timing controls adoption.</text>
</svg>
