<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Phase 6AX resident native parallel Arrhenius complete step</title>
  <desc id="desc">Twenty burning logs compare Python, per-step conversion, and resident native parallel Arrhenius execution with bounded secondary tar conversion.</desc>
  <style>.title{fill:#f8fafc;font:700 29px system-ui,sans-serif}.sub{fill:#cbd5e1;font:16px system-ui,sans-serif}.label{fill:#f8fafc;font:600 16px system-ui,sans-serif}.value{fill:#f8fafc;font:700 15px ui-monospace,monospace}.small{fill:#94a3b8;font:14px system-ui,sans-serif}.decision{fill:#fde68a;font:700 19px system-ui,sans-serif}</style>
  <rect width="1200" height="680" rx="28" fill="#0f172a"/>
  <text x="58" y="76" class="title">Keep all three Arrhenius pathways resident</text>
  <text x="58" y="112" class="sub">20 logs · gas + tar + char competition · bounded secondary tar split · exact step/cumulative outputs</text>
  <rect x="58" y="148" width="1084" height="62" rx="16" fill="#1e293b"/>
  <text x="82" y="174" class="small">ARRHENIUS COMPLETE-STEP GATE</text>
  <text x="82" y="198" class="label">ΔT 0 K · Δmass 1.39e-17 kg · output 1.04e-15 · ignition 60.2 / 166.4 s</text>
  <line x1="387.9" y1="230" x2="387.9" y2="520" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="397.9" y="228" class="value">4 ms p95 gate</text>
  <text x="58" y="272" class="label">Python complete step</text><rect x="380" y="250" width="416.7" height="34" rx="17" fill="#fb7185"/><text x="810.7" y="273" class="value">p95 210.632 ms</text><text x="380" y="308" class="small">mean 168.116 ms</text><text x="58" y="364" class="label">AoS ↔ native complete</text><rect x="380" y="342" width="95.5" height="34" rx="17" fill="#fb7185"/><text x="489.5" y="365" class="value">p95 48.284 ms</text><text x="380" y="400" class="small">mean 39.607 ms</text><text x="58" y="456" class="label">Resident native complete</text><rect x="380" y="434" width="4.5" height="34" rx="17" fill="#22c55e"/><text x="398.5" y="457" class="value">p95 2.292 ms</text><text x="380" y="492" class="small">mean 1.899 ms</text>
  <rect x="58" y="542" width="1084" height="82" rx="18" fill="#1e293b"/>
  <text x="82" y="574" class="decision">Arrhenius resident complete step QUALIFIES; production gate remains closed</text>
  <text x="82" y="603" class="sub">vs Phase 6AW: +1.316 ms · secondary tar 0.000268 kg · app-contract gates remain</text>
  <text x="58" y="656" class="small">Production backend unchanged. Fixed A/E pairs and the 773–1073 K diagnostic tar boundary are preserved.</text>
