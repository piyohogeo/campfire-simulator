<rect width="1200" height="680" rx="30" fill="url(#bg)"/><text x="64" y="62" class="k">PHASE 6CY · UNINTERRUPTED RESIDENT RUN</text><text x="64" y="116" class="t">PLAY CONTINUOUS</text><text x="64" y="154" class="s" fill="#86efac">Flow 110.0.0 · fixed 1280×720 · production unchanged</text>
