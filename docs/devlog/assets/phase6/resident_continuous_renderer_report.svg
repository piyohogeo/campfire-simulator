<rect x="808" y="204" width="328" height="190" rx="20" class="c"/><text x="834" y="246" class="h">after capture callback</text><text x="834" y="304" class="v">10.8 → 11.2 s</text><text x="834" y="344" class="m">revision 55 → 57</text><text x="834" y="374" class="m">active blocks peak 24</text>
