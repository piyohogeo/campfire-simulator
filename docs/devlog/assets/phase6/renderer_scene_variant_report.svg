<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Phase 6CS renderer scene and application matrix</title><desc id="desc">Flow, PhysX, Resident, Phase 3 content, and headless mode are not required for the timeline stop. The editor base preserves play, and fill viewport is a workaround that is not adopted.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#164e63"/></linearGradient><style>.k{font:700 18px system-ui;fill:#67e8f9;letter-spacing:2px}.t{font:700 36px system-ui;fill:#f8fafc}.s{font:19px system-ui;fill:#cbd5e1}.h{font:700 16px system-ui;fill:#a5f3fc}.cell{font:17px system-ui;fill:#e2e8f0}.good{font:700 20px system-ui;fill:#86efac}.bad{font:700 20px system-ui;fill:#fca5a5}.row{fill:#0f172a;stroke:#334155;stroke-width:1}.note{font:17px system-ui;fill:#cffafe}</style></defs>
<rect width="1200" height="680" rx="30" fill="url(#bg)"/><text x="64" y="58" class="k">PHASE 6CS · OFFLINE SCENE / APP MATRIX</text><text x="64" y="110" class="t">The STOP is a compound Campfire app boundary</text><text x="64" y="148" class="s">Flow, PhysX, Resident, Phase 3 content, headless mode: not required</text>
<text x="86" y="204" class="h">SCENE</text><text x="390" y="204" class="h">APPLICATION</text><text x="756" y="204" class="h">VIEWPORT</text><text x="964" y="204" class="h">AFTER FRAME</text><rect x="64" y="230" width="1072" height="48" rx="10" class="row"/><text x="86" y="262" class="cell">No Flow + no PhysX</text><text x="390" y="262" class="cell">Campfire</text><text x="756" y="262" class="cell">1280x720</text><text x="964" y="262" class="bad">STOP</text><rect x="64" y="288" width="1072" height="48" rx="10" class="row"/><text x="86" y="320" class="cell">Camera + Cube only</text><text x="390" y="320" class="cell">Campfire headless</text><text x="756" y="320" class="cell">1280x720</text><text x="964" y="320" class="bad">STOP</text><rect x="64" y="346" width="1072" height="48" rx="10" class="row"/><text x="86" y="378" class="cell">Camera + Cube only</text><text x="390" y="378" class="cell">Campfire windowed</text><text x="756" y="378" class="cell">1280x720</text><text x="964" y="378" class="bad">STOP x2</text><rect x="64" y="404" width="1072" height="48" rx="10" class="row"/><text x="86" y="436" class="cell">Camera + Cube only</text><text x="390" y="436" class="cell">Editor + Flow + app</text><text x="756" y="436" class="cell">1280x720</text><text x="964" y="436" class="good">PLAY</text><rect x="64" y="462" width="1072" height="48" rx="10" class="row"/><text x="86" y="494" class="cell">Camera + Cube only</text><text x="390" y="494" class="cell">Campfire fill=true</text><text x="756" y="494" class="cell">UI size</text><text x="964" y="494" class="good">PLAY</text>
<rect x="64" y="548" width="1072" height="84" rx="16" fill="#083344" stroke="#22d3ee" stroke-width="2"/><text x="88" y="582" class="s">Measured workaround: Campfire fillViewport=true → PLAY</text><text x="88" y="610" class="note">Not adopted: it replaces deterministic 1280×720 capture with UI-sized rendering. Production remains unchanged.</text></svg>