<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Phase 6EX extended stability observation safe stop</title>
  <desc id="desc">The sampler target and R0 resource sample count passed, while active-block variability exceeded the frozen limit.</desc>
  <rect width="1200" height="675" fill="#111318"/>
  <text x="72" y="84" fill="#f0f2f5" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">Phase 6EX · Extended running-Flow stability observation</text>
  <text x="72" y="121" fill="#a8b0bd" font-family="Segoe UI, sans-serif" font-size="18">Sample shortage solved; physical plateau gate remains fail-closed</text>
  <g font-family="Segoe UI, sans-serif">
    <rect x="72" y="166" width="310" height="170" rx="16" fill="#19241f" stroke="#46c37b" stroke-width="2"/>
    <text x="98" y="207" fill="#77e5a3" font-size="18" font-weight="700">Sampler fixture · PASS</text>
    <text x="98" y="251" fill="#f0f2f5" font-size="42" font-weight="700">34</text>
    <text x="176" y="251" fill="#a8b0bd" font-size="18">samples</text>
    <text x="98" y="287" fill="#a8b0bd" font-size="16">target 30 · minimum 20</text>
    <text x="98" y="315" fill="#a8b0bd" font-size="16">identity stable · residual 0</text>

    <rect x="445" y="166" width="310" height="170" rx="16" fill="#19241f" stroke="#46c37b" stroke-width="2"/>
    <text x="471" y="207" fill="#77e5a3" font-size="18" font-weight="700">R0 telemetry · PASS</text>
    <text x="471" y="251" fill="#f0f2f5" font-size="42" font-weight="700">48</text>
    <text x="549" y="251" fill="#a8b0bd" font-size="18">samples</text>
    <text x="471" y="287" fill="#a8b0bd" font-size="16">slope +0.692 MiB/s ≤ 8 MiB/s</text>
    <text x="471" y="315" fill="#a8b0bd" font-size="16">normal exit · close 1.950 s</text>

    <rect x="818" y="166" width="310" height="170" rx="16" fill="#2a1d1d" stroke="#ff735e" stroke-width="2"/>
    <text x="844" y="207" fill="#ff8d7c" font-size="18" font-weight="700">Physical plateau · FAIL</text>
    <text x="844" y="251" fill="#f0f2f5" font-size="42" font-weight="700">24.382%</text>
    <text x="844" y="287" fill="#a8b0bd" font-size="16">active-block range fraction</text>
    <text x="844" y="315" fill="#ff8d7c" font-size="16">frozen limit 15%</text>

    <text x="72" y="405" fill="#f0f2f5" font-size="20" font-weight="700">Observed active blocks during the running window</text>
    <line x1="95" y1="550" x2="1100" y2="550" stroke="#404753"/>
    <polyline fill="none" stroke="#f2b84b" stroke-width="4" points="95,425 155,400 215,406 275,443 335,450 395,427 455,419 515,423 575,405 635,416 695,462 755,459 815,510 875,481 935,443 995,417 1055,445"/>
    <text x="95" y="580" fill="#a8b0bd" font-size="15">frame 320 + 0 s</text>
    <text x="985" y="580" fill="#a8b0bd" font-size="15">+8 s</text>
    <text x="72" y="630" fill="#ff8d7c" font-size="18" font-weight="700">SAFE STOP · R0 0/3 accepted · R1 not started · production unchanged</text>
  </g>
</svg>
