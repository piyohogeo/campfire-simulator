<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Phase 6AH sensible heat profile</title><desc id="desc">Three debugger-free profiles split sensible heat into heat capacity, interior update, surface boundary update, and profiler overhead.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2d48"/><stop offset="1" stop-color="#1c1917"/></linearGradient></defs><style>.title{font:750 37px 'Segoe UI',sans-serif;fill:#f8fafc}.kicker{font:700 17px 'Segoe UI',sans-serif;fill:#7dd3fc;letter-spacing:2px}.sub{font:16px 'Segoe UI',sans-serif;fill:#cbd5e1}.label{font:650 15px 'Segoe UI',sans-serif;fill:#f8fafc}.value{font:14px 'Segoe UI',sans-serif;fill:#bae6fd}.small{font:14px 'Segoe UI',sans-serif;fill:#94a3b8}.decision{font:750 22px 'Segoe UI',sans-serif;fill:#fdba74}</style><rect width="1200" height="680" rx="30" fill="url(#bg)"/><text x="64" y="60" class="kicker">PHASE 6AH - SENSIBLE-HEAT DECOMPOSITION</text><text x="64" y="110" class="title">Heat-capacity evaluation dominates measured work</text><text x="64" y="145" class="sub">3 runs - 1,180 measured two-log steps each - 792 interior + 360 surface cells per log</text><rect x="64" y="184" width="1072" height="372" rx="22" fill="#0f2535" stroke="#0ea5e9"/><text x="92" y="246" class="label">Heat capacity evaluation</text><rect x="348" y="226" width="500.0" height="28" rx="14" fill="#fb923c"/><text x="870" y="246" class="value">2.650 ms / 62.0%</text><text x="92" y="322" class="label">Surface boundary update</text><rect x="348" y="302" width="83.2" height="28" rx="14" fill="#38bdf8"/><text x="870" y="322" class="value">0.441 ms / 10.3%</text><text x="92" y="398" class="label">Interior conduction-only update</text><rect x="348" y="378" width="53.7" height="28" rx="14" fill="#38bdf8"/><text x="870" y="398" class="value">0.285 ms / 6.7%</text><text x="92" y="474" class="label">Loop and timer overhead</text><rect x="348" y="454" width="169.7" height="28" rx="14" fill="#64748b"/><text x="870" y="474" class="value">0.899 ms / 21.0%</text><text x="64" y="600" class="decision">Next candidate: Heat capacity evaluation</text><text x="64" y="630" class="small">2.650 ms - 78.5% of measured operations; per-cell timers make this selection-only evidence.</text><text x="64" y="658" class="small">Profiled parent 4.277 ms - exact state, CSV, and ignition across all runs.</text></svg>
