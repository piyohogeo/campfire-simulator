<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Phase 6AL Phase 6AK adopted-path reprofile</title>
  <desc id="desc">Three broad profiles and three detailed sensible-heat profiles rank costs after adopting step-local homogeneous heat capacity.</desc>
