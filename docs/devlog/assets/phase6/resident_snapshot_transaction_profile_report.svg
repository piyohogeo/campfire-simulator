<text x="430" y="158" class="label">Snapshot construction</text><text x="430" y="201" class="metric">0.9094 ms p95</text>
<text x="760" y="158" class="label">Adapter transaction</text><text x="760" y="201" class="metric">4.5441 ms p95</text>
<text x="80" y="240" class="small">The historical boundary included construction. The 4 ms gate now applies to the isolated adapter transaction.</text>
