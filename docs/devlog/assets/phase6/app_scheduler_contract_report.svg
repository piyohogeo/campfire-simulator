<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Phase 6AS app scheduler input and output contract</title>
  <desc id="desc">Fixed and moving heat inputs compare requested activity, accumulated awake solvers, and frame latency cost.</desc>
  <style>.title{font:750 34px 'Segoe UI',sans-serif;fill:#f8fafc}.kicker{font:700 16px 'Segoe UI',sans-serif;fill:#fda4af;letter-spacing:2px}.sub{font:15px 'Segoe UI',sans-serif;fill:#cbd5e1}.rowtitle{font:750 18px 'Segoe UI',sans-serif;fill:#f8fafc}.value{font:650 14px 'Segoe UI',sans-serif;fill:#f8fafc}.small{font:13px 'Segoe UI',sans-serif;fill:#94a3b8}.decision{font:750 20px 'Segoe UI',sans-serif;fill:#fde68a}</style>
  <rect width="1200" height="680" rx="30" fill="#111827"/>
  <text x="58" y="56" class="kicker">PHASE 6AS - APP CONTRACT TRIAL</text>
  <text x="58" y="102" class="title">Moving heat defeats exact-equilibrium capacity</text>
  <text x="58" y="136" class="sub">20 logs · snapshot heat + oxygen · 12 publish slots · coherent emitter / visual / support revisions</text>
  <rect x="42" y="170" width="1116" height="360" rx="20" fill="#142033" stroke="#334155"/>
  <text x="210" y="205" class="small">requested heat / final awake solver count</text>
  <text x="785" y="205" class="small">full app-contract frame cost</text>
  <line x1="986.5" y1="215" x2="986.5" y2="500" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="60" y="255" class="rowtitle">Fixed 5</text><rect x="210" y="235" width="300" height="22" rx="11" fill="#293548"/><rect x="210" y="235" width="75.0" height="22" rx="11" fill="#38bdf8"/><rect x="210" y="266" width="300" height="22" rx="11" fill="#293548"/><rect x="210" y="266" width="75.0" height="22" rx="11" fill="#f59e0b"/><text x="522" y="252" class="value">request 5/20</text><text x="522" y="283" class="value">awake 5/20</text><rect x="785" y="243" width="148.8" height="34" rx="17" fill="#22c55e"/><text x="945.8" y="265" class="value">p95 2.955 ms</text><text x="60" y="347" class="rowtitle">Fixed 12</text><rect x="210" y="327" width="300" height="22" rx="11" fill="#293548"/><rect x="210" y="327" width="180.0" height="22" rx="11" fill="#38bdf8"/><rect x="210" y="358" width="300" height="22" rx="11" fill="#293548"/><rect x="210" y="358" width="180.0" height="22" rx="11" fill="#f59e0b"/><text x="522" y="344" class="value">request 12/20</text><text x="522" y="375" class="value">awake 12/20</text><rect x="785" y="335" width="156.9" height="34" rx="17" fill="#22c55e"/><text x="953.9" y="357" class="value">p95 3.115 ms</text><text x="60" y="439" class="rowtitle">Rotating 5</text><rect x="210" y="419" width="300" height="22" rx="11" fill="#293548"/><rect x="210" y="419" width="75.0" height="22" rx="11" fill="#38bdf8"/><rect x="210" y="450" width="300" height="22" rx="11" fill="#293548"/><rect x="210" y="450" width="300.0" height="22" rx="11" fill="#f59e0b"/><text x="522" y="436" class="value">request 5/20</text><text x="522" y="467" class="value">awake 20/20</text><rect x="785" y="427" width="276.8" height="34" rx="17" fill="#fb7185"/><text x="1073.8" y="449" class="value">p95 5.495 ms</text>
  <text x="58" y="578" class="decision">Rotating 5 wakes all 20 in 0.8 model seconds</text>
  <text x="58" y="611" class="sub">Only 25% receives heat per tick, but exact sleep cannot reclaim a previously warmed log.</text>
  <text x="58" y="642" class="small">State and published outputs match the synchronous reference; maximum publish latency is 11 frames (183.3 ms at 60 fps).</text>
</svg>
