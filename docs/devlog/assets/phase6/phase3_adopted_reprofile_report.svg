<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Phase 6AJ adopted-path two-depth profile</title>
  <desc id="desc">Three internal-only runs and three detailed sensible-heat runs rank the current Python wood-step costs after Phase 6AI.</desc>
  <style>.title{font:750 36px 'Segoe UI',sans-serif;fill:#f8fafc}.kicker{font:700 16px 'Segoe UI',sans-serif;fill:#fbbf24;letter-spacing:2px}.sub{font:15px 'Segoe UI',sans-serif;fill:#cbd5e1}.heading{font:700 19px 'Segoe UI',sans-serif;fill:#f8fafc}.label{font:650 13px 'Segoe UI',sans-serif;fill:#f8fafc}.value{font:13px 'Segoe UI',sans-serif;fill:#cbd5e1}.small{font:13px 'Segoe UI',sans-serif;fill:#94a3b8}.decision{font:750 21px 'Segoe UI',sans-serif;fill:#fde68a}</style>
  <rect width="1200" height="680" rx="30" fill="#111827"/>
  <text x="58" y="56" class="kicker">PHASE 6AJ - ADOPTED-PATH REPROFILE</text>
  <text x="58" y="104" class="title">Separate broad timing from per-cell detail</text>
  <text x="58" y="137" class="sub">3 internal-only + 3 detailed runs - constant-model fast path - exact state, CSV, and ignition</text>
  <rect x="42" y="168" width="620" height="414" rx="20" fill="#142033" stroke="#0ea5e9"/>
  <text x="70" y="194" class="heading">Wood-step internals</text>
  <text x="70" y="212" class="label">Sensible heat</text><rect x="218" y="197" width="260.0" height="21" rx="10" fill="#fb923c"/><text x="490" y="212" class="value">2.951 ms / 46.4%</text><text x="70" y="255" class="label">Pyrolysis</text><rect x="218" y="240" width="97.5" height="21" rx="10" fill="#38bdf8"/><text x="490" y="255" class="value">1.107 ms / 17.4%</text><text x="70" y="298" class="label">Conduction</text><rect x="218" y="283" width="82.7" height="21" rx="10" fill="#38bdf8"/><text x="490" y="298" class="value">0.939 ms / 14.8%</text><text x="70" y="341" class="label">Evaporation</text><rect x="218" y="326" width="51.8" height="21" rx="10" fill="#38bdf8"/><text x="490" y="341" class="value">0.588 ms / 9.2%</text><text x="70" y="384" class="label">State finalize</text><rect x="218" y="369" width="33.4" height="21" rx="10" fill="#38bdf8"/><text x="490" y="384" class="value">0.379 ms / 6.0%</text><text x="70" y="427" class="label">Char oxidation</text><rect x="218" y="412" width="32.5" height="21" rx="10" fill="#38bdf8"/><text x="490" y="427" class="value">0.369 ms / 5.8%</text><text x="70" y="470" class="label">Result aggregation</text><rect x="218" y="455" width="1.8" height="21" rx="10" fill="#38bdf8"/><text x="490" y="470" class="value">0.021 ms / 0.3%</text><text x="70" y="513" class="label">Input validation</text><rect x="218" y="498" width="0.6" height="21" rx="10" fill="#38bdf8"/><text x="490" y="513" class="value">0.006 ms / 0.1%</text>
  <rect x="682" y="168" width="476" height="414" rx="20" fill="#211d15" stroke="#ca8a04"/>
  <text x="710" y="204" class="heading">Sensible-heat detail</text>
  <text x="710" y="248" class="label">Heat capacity evaluation</text><rect x="710" y="260" width="190.0" height="20" rx="10" fill="#fbbf24"/><text x="912" y="276" class="value">2.557 ms / 58.5%</text><text x="710" y="324" class="label">Surface boundary update</text><rect x="710" y="336" width="37.7" height="20" rx="10" fill="#22c55e"/><text x="912" y="352" class="value">0.508 ms / 11.6%</text><text x="710" y="400" class="label">Interior conduction-only update</text><rect x="710" y="412" width="23.2" height="20" rx="10" fill="#22c55e"/><text x="912" y="428" class="value">0.313 ms / 7.2%</text><text x="710" y="476" class="label">Loop and timer overhead</text><rect x="710" y="488" width="73.7" height="20" rx="10" fill="#64748b"/><text x="912" y="504" class="value">0.992 ms / 22.7%</text>
  <text x="58" y="620" class="decision">Next audit: Heat capacity evaluation - 2.557 ms</text>
  <text x="58" y="648" class="small">Selection only. No cross-step cache; any trial still needs alternating unprofiled end-to-end improvement.</text>
</svg>
