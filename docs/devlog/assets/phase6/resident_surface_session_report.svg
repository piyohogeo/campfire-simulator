<rect x="64" y="326" width="1072" height="112" rx="20" fill="#231c18" stroke="#9a3412"/><text x="90" y="362" class="h">Primary publication failure at revision 3</text><text x="90" y="404" class="v">Point rolls 3 → 2 · primary replays 2 → exact retry → all 3</text>
<rect x="64" y="462" width="520" height="104" rx="18" fill="#12202e"/><text x="88" y="498" class="h">Layout + stage lifecycle</text><text x="88" y="534" class="v">layout rev 2 · stage change fail-closed</text>
<rect x="600" y="462" width="536" height="104" rx="18" fill="#12202e"/><text x="624" y="498" class="h">Real Flow capture</text><text x="624" y="534" class="v">60 frames · 60 unique · 1695 active blocks</text>
<text x="64" y="616" class="ok">14/14 gates · no live structural resync · production activation unchanged</text><text x="64" y="650" class="m">Next: rebuild the sidecar on a replacement stage and qualify normal recovery instead of forced pending discard.</text></svg>