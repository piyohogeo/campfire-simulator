<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Phase 6AG adopted-path internal profile</title><desc id="desc">Three debugger-free profiles rank current Python wood-step segments after adopted optimizations.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#082f49"/><stop offset="1" stop-color="#1c1917"/></linearGradient></defs><style>.title{font:750 37px 'Segoe UI',sans-serif;fill:#f8fafc}.kicker{font:700 17px 'Segoe UI',sans-serif;fill:#7dd3fc;letter-spacing:2px}.sub{font:16px 'Segoe UI',sans-serif;fill:#cbd5e1}.label{font:650 15px 'Segoe UI',sans-serif;fill:#f8fafc}.value{font:14px 'Segoe UI',sans-serif;fill:#bae6fd}.small{font:14px 'Segoe UI',sans-serif;fill:#94a3b8}.decision{font:750 22px 'Segoe UI',sans-serif;fill:#fdba74}</style><rect width="1200" height="680" rx="30" fill="url(#bg)"/><text x="64" y="60" class="kicker">PHASE 6AG - ADOPTED-PATH REPROFILE</text><text x="64" y="110" class="title">Update the CPU hotspot map after cumulative changes</text><text x="64" y="144" class="sub">3 runs - 1,180 measured two-log steps each - exact state, CSV, and ignition</text><rect x="64" y="172" width="810" height="420" rx="22" fill="#0f2535" stroke="#0ea5e9"/><text x="88" y="214" class="label">Sensible heat</text><rect x="260" y="197" width="390.0" height="24" rx="12" fill="#fb923c"/><text x="666" y="214" class="value">3.003 ms / 48.9%</text><text x="88" y="262" class="label">Pyrolysis</text><rect x="260" y="245" width="133.2" height="24" rx="12" fill="#38bdf8"/><text x="666" y="262" class="value">1.026 ms / 16.7%</text><text x="88" y="310" class="label">Conduction</text><rect x="260" y="293" width="110.7" height="24" rx="12" fill="#38bdf8"/><text x="666" y="310" class="value">0.852 ms / 13.9%</text><text x="88" y="358" class="label">Evaporation</text><rect x="260" y="341" width="69.5" height="24" rx="12" fill="#38bdf8"/><text x="666" y="358" class="value">0.535 ms / 8.7%</text><text x="88" y="406" class="label">Char oxidation</text><rect x="260" y="389" width="46.5" height="24" rx="12" fill="#38bdf8"/><text x="666" y="406" class="value">0.358 ms / 5.8%</text><text x="88" y="454" class="label">State finalize</text><rect x="260" y="437" width="44.8" height="24" rx="12" fill="#38bdf8"/><text x="666" y="454" class="value">0.345 ms / 5.6%</text><text x="88" y="502" class="label">Result aggregation</text><rect x="260" y="485" width="2.4" height="24" rx="12" fill="#38bdf8"/><text x="666" y="502" class="value">0.018 ms / 0.3%</text><text x="88" y="550" class="label">Input validation</text><rect x="260" y="533" width="0.7" height="24" rx="12" fill="#38bdf8"/><text x="666" y="550" class="value">0.005 ms / 0.1%</text><rect x="902" y="172" width="234" height="420" rx="22" fill="#291b13" stroke="#f97316"/><text x="928" y="214" class="kicker">NEXT CANDIDATE</text><text x="928" y="254" class="decision">Sensible heat</text><text x="928" y="284" class="sub">3.003 ms</text><text x="928" y="308" class="sub">48.9% of internals</text><line x1="928" y1="338" x2="1110" y2="338" stroke="#7c2d12"/><text x="928" y="374" class="small">Internal total</text><text x="928" y="398" class="sub">11.635 to 6.143 ms</text><text x="928" y="438" class="small">Profiled full step</text><text x="928" y="462" class="sub">6.193 ms</text><text x="928" y="502" class="small">Profiled scenario</text><text x="928" y="526" class="sub">10.319 s</text><text x="928" y="566" class="small">Selection only - not adoption</text><line x1="64" y1="624" x2="1136" y2="624" stroke="#334155"/><text x="64" y="654" class="small">Any trial still requires exact outputs and alternating unprofiled step-loop + scenario improvement.</text></svg>
