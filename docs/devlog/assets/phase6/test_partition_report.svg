<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Phase 6V standard test partition report</title>
  <desc id="desc">The former single coverage process exceeded the 300 second limit. The restored path runs 39 coverage tests in 217.7 seconds and one calibration test without coverage in 24.5 seconds. All 40 tests pass in 246.9 seconds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="30" fill="url(#bg)"/>
  <circle cx="1090" cy="65" r="125" fill="#f97316" opacity=".07"/>
  <circle cx="1050" cy="640" r="180" fill="#22c55e" opacity=".05"/>

  <text x="64" y="68" fill="#fb923c" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="2">PHASE 6V · VALIDATION INFRASTRUCTURE</text>
  <text x="64" y="112" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="36" font-weight="750">Standard test path restored</text>
  <text x="64" y="143" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="17">Same numerical test · same 300 s limit · explicit coverage boundary</text>

  <g filter="url(#shadow)">
    <rect x="64" y="184" width="500" height="340" rx="22" fill="#172033" stroke="#334155"/>
    <rect x="636" y="184" width="500" height="340" rx="22" fill="#111f25" stroke="#166534"/>
  </g>

  <text x="96" y="226" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">BEFORE · ONE COVERAGE PROCESS</text>
  <text x="668" y="226" fill="#86efac" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">AFTER · TWO TEST PROCESSES</text>

  <text x="96" y="278" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">40 tests + coverage</text>
  <rect x="96" y="305" width="405" height="34" rx="17" fill="#293548"/>
  <rect x="96" y="305" width="405" height="34" rx="17" fill="#ef4444" opacity=".78"/>
  <line x1="501" y1="293" x2="501" y2="350" stroke="#fecaca" stroke-width="2"/>
  <text x="96" y="374" fill="#fecaca" font-family="Segoe UI, sans-serif" font-size="42" font-weight="750">300 s</text>
  <text x="245" y="370" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="17">process limit reached</text>
  <text x="96" y="418" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="16">The deterministic grid search was correct,</text>
  <text x="96" y="443" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="16">but coverage instrumentation dominated runtime.</text>
  <rect x="96" y="472" width="182" height="30" rx="15" fill="#3f1d25"/>
  <text x="114" y="493" fill="#fda4af" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">STANDARD PATH FAILED</text>

  <text x="668" y="271" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">39 regular + API checks</text>
  <text x="1068" y="271" text-anchor="end" fill="#86efac" font-family="Segoe UI, sans-serif" font-size="22" font-weight="750">217.7 s</text>
  <rect x="668" y="289" width="400" height="28" rx="14" fill="#21313b"/>
  <rect x="668" y="289" width="290" height="28" rx="14" fill="#22c55e" opacity=".76"/>
  <text x="668" y="342" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="15">coverage enabled</text>

  <text x="668" y="390" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">1 calibration grid search</text>
  <text x="1068" y="390" text-anchor="end" fill="#fdba74" font-family="Segoe UI, sans-serif" font-size="22" font-weight="750">24.5 s</text>
  <rect x="668" y="408" width="400" height="28" rx="14" fill="#21313b"/>
  <rect x="668" y="408" width="33" height="28" rx="14" fill="#f97316" opacity=".9"/>
  <text x="668" y="461" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="15">coverage disabled · numerical assertions retained</text>
  <rect x="668" y="481" width="196" height="30" rx="15" fill="#143522"/>
  <text x="687" y="502" fill="#86efac" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">40 / 40 TESTS PASSED</text>

  <line x1="64" y1="564" x2="1136" y2="564" stroke="#273449"/>
  <text x="64" y="612" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">Standard command</text>
  <text x="64" y="640" fill="#94a3b8" font-family="Consolas, monospace" font-size="17">.\repo.bat test</text>
  <text x="814" y="612" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="16">startup 3.8 s</text>
  <text x="1136" y="612" text-anchor="end" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="27" font-weight="750">246.9 s total</text>
  <text x="1136" y="641" text-anchor="end" fill="#86efac" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">ALL PROCESSES BELOW 300 s</text>
</svg>
