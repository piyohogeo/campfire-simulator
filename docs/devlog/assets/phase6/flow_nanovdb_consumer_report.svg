<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Phase 6BR to 6BT fixed Flow NanoVDB consumer boundary</title>
  <desc id="desc">The five native buffers map to red, green, blue, alpha float grids and one packed RGBA8 grid. Five public USD consumer arrangements preserved revision one but all reported zero active Flow blocks, so the consumer remains unqualified.</desc>
  <rect width="1200" height="680" rx="32" fill="#111820"/>
  <text x="70" y="68" fill="#f4b860" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">PHASE 6BR–6BT · FIXED FLOW 110.0.0 · DEFAULT OFF</text>
  <text x="70" y="116" fill="#fff" font-family="Segoe UI, sans-serif" font-size="35" font-weight="700">Producer mapped; consumer still unqualified</text>
  <text x="70" y="150" fill="#a8beca" font-family="Segoe UI, sans-serif" font-size="17">RTX 3090 · complete stage before attach · no live structural mutation · production unchanged</text>

  <rect x="70" y="190" width="470" height="350" rx="20" fill="#182128"/>
  <text x="105" y="232" fill="#fff" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700">Five-buffer runtime mapping</text>
  <rect x="105" y="265" width="400" height="42" rx="10" fill="#492327"/><text x="125" y="292" fill="#fff" font-family="Consolas, monospace" font-size="16">0 · red float     → temperature</text>
  <rect x="105" y="317" width="400" height="42" rx="10" fill="#1d4937"/><text x="125" y="344" fill="#fff" font-family="Consolas, monospace" font-size="16">1 · green float   → fuel</text>
  <rect x="105" y="369" width="400" height="42" rx="10" fill="#203a59"/><text x="125" y="396" fill="#fff" font-family="Consolas, monospace" font-size="16">2 · blue float    → burn</text>
  <rect x="105" y="421" width="400" height="42" rx="10" fill="#3b4148"/><text x="125" y="448" fill="#fff" font-family="Consolas, monospace" font-size="16">3 · alpha float   → smoke mask</text>
  <rect x="105" y="473" width="400" height="42" rx="10" fill="#4b3820"/><text x="125" y="500" fill="#fff" font-family="Consolas, monospace" font-size="16">4 · RGBA8 packed  → all four</text>

  <rect x="570" y="190" width="560" height="350" rx="20" fill="#192734" stroke="#315269"/>
  <text x="605" y="232" fill="#fff" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700">Public consumer trials</text>
  <text x="605" y="276" fill="#d7e1e8" font-family="Segoe UI, sans-serif" font-size="16">4 direct float uint arrays</text><text x="1060" y="276" text-anchor="end" fill="#f28b82" font-family="Consolas, monospace" font-size="16">0 blocks</text>
  <text x="605" y="320" fill="#d7e1e8" font-family="Segoe UI, sans-serif" font-size="16">1 direct packed RGBA8 uint array</text><text x="1060" y="320" text-anchor="end" fill="#f28b82" font-family="Consolas, monospace" font-size="16">0 blocks</text>
  <text x="605" y="364" fill="#d7e1e8" font-family="Segoe UI, sans-serif" font-size="16">RGBA8 inside FlowPointCloud</text><text x="1060" y="364" text-anchor="end" fill="#f28b82" font-family="Consolas, monospace" font-size="16">0 blocks</text>
  <text x="605" y="408" fill="#d7e1e8" font-family="Segoe UI, sans-serif" font-size="16">.nvdb through volumePrim / UsdVol</text><text x="1060" y="408" text-anchor="end" fill="#f28b82" font-family="Consolas, monospace" font-size="16">0 blocks</text>
  <text x="605" y="452" fill="#d7e1e8" font-family="Segoe UI, sans-serif" font-size="16">.nvdb through schema assetPath</text><text x="1060" y="452" text-anchor="end" fill="#f28b82" font-family="Consolas, monospace" font-size="16">0 blocks</text>
  <line x1="605" y1="478" x2="1095" y2="478" stroke="#506678"/>
  <text x="605" y="502" fill="#65c18c" font-family="Segoe UI, sans-serif" font-size="15">USD payload persisted · stage reopened</text>
  <text x="605" y="526" fill="#65c18c" font-family="Segoe UI, sans-serif" font-size="15">Consumer revision</text><text x="1060" y="526" text-anchor="end" fill="#65c18c" font-family="Consolas, monospace" font-size="16">PASS · rev 1</text>

  <rect x="70" y="575" width="1060" height="62" rx="18" fill="#3a2d18" stroke="#f4b860"/>
  <text x="100" y="601" fill="#f4b860" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">NO ADOPTION · no public arrangement produced a qualified Flow consumer.</text>
  <text x="100" y="624" fill="#d7e1e8" font-family="Segoe UI, sans-serif" font-size="14">Do not infer ingest, rasterization, solver, rendering, or output equivalence from successful USD authoring.</text>
</svg>
