<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Phase 6AP adopted slotted-path reprofile</title>
  <desc id="desc">Three broad profiles and three detailed sensible-heat profiles rank costs after adopting inline homogeneous sensible heat capacity.</desc>
  <style>.title{font:750 36px 'Segoe UI',sans-serif;fill:#f8fafc}.kicker{font:700 16px 'Segoe UI',sans-serif;fill:#fda4af;letter-spacing:2px}.sub{font:15px 'Segoe UI',sans-serif;fill:#cbd5e1}.heading{font:700 19px 'Segoe UI',sans-serif;fill:#f8fafc}.label{font:650 13px 'Segoe UI',sans-serif;fill:#f8fafc}.value{font:13px 'Segoe UI',sans-serif;fill:#cbd5e1}.small{font:13px 'Segoe UI',sans-serif;fill:#94a3b8}.decision{font:750 21px 'Segoe UI',sans-serif;fill:#fde68a}</style>
  <rect width="1200" height="680" rx="30" fill="#111827"/>
  <text x="58" y="56" class="kicker">PHASE 6AP - ADOPTED SLOTTED PATH REPROFILE</text>
  <text x="58" y="104" class="title">Re-rank costs after slotted cell adoption</text>
  <text x="58" y="137" class="sub">3 broad + 3 detailed runs - slotted cells active - exact state, CSV, and ignition</text>
  <rect x="42" y="168" width="620" height="414" rx="20" fill="#142033" stroke="#0ea5e9"/>
  <text x="70" y="194" class="heading">Wood-step internals</text>
  <text x="70" y="212" class="label">Sensible heat</text><rect x="218" y="197" width="260.0" height="21" rx="10" fill="#fb7185"/><text x="490" y="212" class="value">2.022 ms / 37.1%</text><text x="70" y="255" class="label">Pyrolysis</text><rect x="218" y="240" width="140.4" height="21" rx="10" fill="#38bdf8"/><text x="490" y="255" class="value">1.092 ms / 20.0%</text><text x="70" y="298" class="label">Conduction</text><rect x="218" y="283" width="128.5" height="21" rx="10" fill="#38bdf8"/><text x="490" y="298" class="value">0.999 ms / 18.3%</text><text x="70" y="341" class="label">Evaporation</text><rect x="218" y="326" width="77.6" height="21" rx="10" fill="#38bdf8"/><text x="490" y="341" class="value">0.604 ms / 11.1%</text><text x="70" y="384" class="label">State finalize</text><rect x="218" y="369" width="47.7" height="21" rx="10" fill="#38bdf8"/><text x="490" y="384" class="value">0.371 ms / 6.8%</text><text x="70" y="427" class="label">Char oxidation</text><rect x="218" y="412" width="43.0" height="21" rx="10" fill="#38bdf8"/><text x="490" y="427" class="value">0.335 ms / 6.1%</text><text x="70" y="470" class="label">Result aggregation</text><rect x="218" y="455" width="2.9" height="21" rx="10" fill="#38bdf8"/><text x="490" y="470" class="value">0.023 ms / 0.4%</text><text x="70" y="513" class="label">Input validation</text><rect x="218" y="498" width="0.9" height="21" rx="10" fill="#38bdf8"/><text x="490" y="513" class="value">0.007 ms / 0.1%</text>
  <rect x="682" y="168" width="476" height="414" rx="20" fill="#211d15" stroke="#ca8a04"/>
  <text x="710" y="204" class="heading">Sensible-heat detail</text>
  <text x="710" y="248" class="label">Heat capacity evaluation</text><rect x="710" y="260" width="190.0" height="20" rx="10" fill="#fbbf24"/><text x="912" y="276" class="value">1.555 ms / 41.8%</text><text x="710" y="324" class="label">Surface boundary update</text><rect x="710" y="336" width="70.7" height="20" rx="10" fill="#22c55e"/><text x="912" y="352" class="value">0.579 ms / 15.6%</text><text x="710" y="400" class="label">Interior conduction-only update</text><rect x="710" y="412" width="42.7" height="20" rx="10" fill="#22c55e"/><text x="912" y="428" class="value">0.350 ms / 9.4%</text><text x="710" y="476" class="label">Loop and timer overhead</text><rect x="710" y="488" width="151.0" height="20" rx="10" fill="#64748b"/><text x="912" y="504" class="value">1.236 ms / 33.2%</text>
  <text x="58" y="620" class="decision">Next audit: Heat capacity evaluation - 1.555 ms</text>
  <text x="58" y="648" class="small">Selection only. Any trial still needs alternating unprofiled end-to-end improvement and exact outputs.</text>
</svg>
