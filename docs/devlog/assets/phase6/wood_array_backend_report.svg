<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#15120f"/>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #fff7e9; }
