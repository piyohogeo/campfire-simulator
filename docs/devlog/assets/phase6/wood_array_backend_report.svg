  <text x="72" y="268" class="detail">AoS + H2D + kernel + D2H</text>
  <rect x="360" y="236" width="350.00" height="18" rx="4" fill="#cf765f"/>
  <text x="728" y="251" class="value">4.1594 ms/step</text><text x="72" y="305" class="label">NumPy resident</text>
  <text x="72" y="322" class="detail">one boundary crossing per 400 steps</text>
