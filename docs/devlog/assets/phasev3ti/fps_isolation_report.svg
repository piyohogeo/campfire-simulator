<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><style>.title{font:700 34px Segoe UI,sans-serif;fill:#f8fafc}.sub{font:16px Segoe UI,sans-serif;fill:#a7b2c2}.label{font:700 16px Segoe UI,sans-serif;fill:#e2e8f0}.value{font:700 16px Segoe UI,sans-serif;fill:#f8fafc}.note{font:15px Segoe UI,sans-serif;fill:#fbbf24}</style><rect width="1100" height="720" rx="28" fill="#0b1625"/><text x="55" y="62" class="sub">PHASE V3T-I / EXISTING VISIBLE VIEWPORT</text><text x="55" y="108" class="title">FPS isolation at unchanged 60% power limit</text><text x="55" y="142" class="sub">RTX 3090 / 20 logs / 3 independent runs / no added render path</text><text x="55" y="229" class="label">Empty stage</text><rect x="275" y="205" width="647.7" height="36" rx="8" fill="#38bdf8"/><text x="932.7" y="230" class="value">71.97 FPS</text><text x="55" y="301" class="label">20 logs / Flow OFF</text><rect x="275" y="277" width="286.3" height="36" rx="8" fill="#f59e0b"/><text x="571.3" y="302" class="value">31.81 FPS</text><text x="55" y="373" class="label">640 x 360</text><rect x="275" y="349" width="539.8" height="36" rx="8" fill="#34d399"/><text x="824.8" y="374" class="value">59.98 FPS</text><text x="55" y="445" class="label">1920 x 1080</text><rect x="275" y="421" width="244.3" height="36" rx="8" fill="#fb7185"/><text x="529.3" y="446" class="value">27.15 FPS</text><text x="55" y="517" class="label">Flow simulation</text><rect x="275" y="493" width="216.7" height="36" rx="8" fill="#a78bfa"/><text x="501.7" y="518" class="value">24.08 FPS</text><text x="55" y="589" class="label">Flow + volume</text><rect x="275" y="565" width="216.9" height="36" rx="8" fill="#e879f9"/><text x="501.9" y="590" class="value">24.10 FPS</text><text x="55" y="665" class="note">210 W enforced / 350 W default. Display-present FPS and raw frame p95/p99 were not available.</text><text x="55" y="696" class="sub">640x360 reaches the 59 Hz present limit; Flow simulation and volume are nearly identical in this scene.</text></svg>