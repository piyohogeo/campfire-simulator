<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Candidate Performance temporary standard</title>
  <desc id="desc">Effective startup settings and V3 Flow regression results for the temporary rendering standard.</desc>
  <rect width="1200" height="440" rx="28" fill="#0f172a"/>
  <text x="54" y="62" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">Candidate Performance · temporary standard</text>
  <text x="54" y="94" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="17">normal + benchmark effective values · V3 explicit regression</text>
  <g font-family="Segoe UI, sans-serif">
    <rect x="54" y="130" width="330" height="236" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="78" y="171" fill="#c4b5fd" font-size="19" font-weight="700">Startup standard</text>
    <text x="78" y="218" fill="#f8fafc" font-size="30" font-weight="700">DLSS Performance</text>
    <text x="78" y="256" fill="#cbd5e1" font-size="17">RTX Real-Time 2.0</text>
    <text x="78" y="286" fill="#cbd5e1" font-size="17">maxBounces = 2 · AO ON</text>
    <text x="78" y="316" fill="#cbd5e1" font-size="17">1280×720 · VSync OFF</text>
    <text x="78" y="346" fill="#cbd5e1" font-size="17">210 W unchanged</text>
    <rect x="435" y="130" width="330" height="236" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="459" y="171" fill="#7dd3fc" font-size="19" font-weight="700">Known Flow reference</text>
    <text x="459" y="218" fill="#f8fafc" font-size="36" font-weight="700">47.858 FPS</text>
    <text x="459" y="256" fill="#cbd5e1" font-size="17">20.90 ms derived frame time</text>
    <text x="459" y="286" fill="#fbbf24" font-size="17">58 FPS gate: not met</text>
    <text x="459" y="316" fill="#cbd5e1" font-size="17">visible render counter</text>
    <text x="459" y="346" fill="#cbd5e1" font-size="17">display-present FPS: unmeasured</text>
    <rect x="816" y="130" width="330" height="236" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="840" y="171" fill="#6ee7b7" font-size="19" font-weight="700">V3 + Flow regression</text>
    <text x="840" y="218" fill="#f8fafc" font-size="32" font-weight="700">revision 1200</text>
    <text x="840" y="256" fill="#cbd5e1" font-size="17">active blocks 278 / peak 305</text>
    <text x="840" y="286" fill="#cbd5e1" font-size="17">V3 failures 0 · mass error 0</text>
    <text x="840" y="316" fill="#cbd5e1" font-size="17">flame · shadow · texture</text>
    <text x="840" y="346" fill="#cbd5e1" font-size="17">hot emission retained</text>
  </g>
  <text x="54" y="410" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="15">AutoBaseline and Candidate Balanced remain explicit comparison presets; Minimal and AO OFF are not production candidates.</text>
</svg>
