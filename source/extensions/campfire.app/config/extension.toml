[package]
title = "Campfire App"
version = "0.1.0"  # Semantic Versioning is used: https://semver.org/
description = "Deterministic wood, air-supply, segmented-collapse, PhysX, and Flow validation for Campfire Simulator."
category = "Simulation"
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"  # Icon to show in the Extension Manager
keywords = ["kit", "campfire", "simulation"]
preview_image = "data/preview.png"  # Preview to show in the Extension Manager
readme  = "docs/README.md"  # Path (relative to the root) or content of readme markdown file for UI
repository = ""


[dependencies]
"omni.flowusd" = {}
"omni.physx" = {}
"omni.timeline" = {}
"omni.ui" = {}
"omni.usd" = {}
"omni.kit.viewport.utility" = {}


[settings]


[[python.module]]  # Main python module this extension provides, it will be publicly available as "import campfire.app"
name = "campfire.app"


[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]


# Keep the primary test unnamed.  The Kit template injects its generated
# ExtensionActions API documentation check only for the default test id.
[[test]]
dependencies = [
]

args = [
]

pythonTests.include = [
    "campfire.app.*",
]
pythonTests.exclude = [
    "campfire.app.tests.test_scene.TestScene.test_nist_grid_search_improves_baseline_without_hiding_error",
    "campfire.app.tests.test_scene.TestScene.test_numpy_backend_matches_python_for_complete_steps",
    "campfire.app.tests.test_scene.TestScene.test_layered_panel_preserves_mass_and_heats_through_five_plies",
    "campfire.app.tests.test_scene.TestScene.test_parallel_arrhenius_pathways_compete_and_conserve_product_mass",
    "campfire.app.tests.test_scene.TestScene.test_temperature_dependent_heat_capacity_is_normalized_and_clamped",
    "campfire.app.tests.test_scene.TestScene.test_wet_kindling_evaporates_and_ignites_after_dry_kindling",
    "campfire.app.tests.test_scene.TestScene.test_collapse_scenario_releases_and_reignites_with_mass_balance",
    "campfire.app.tests.test_scene.TestScene.test_log_cabin_air_feedback_ignites_before_dense_stack",
    "campfire.app.tests.test_scene.TestScene.test_nist_reference_is_fixed_and_higher_flux_ignites_first",
]


[[test]]
name = "thermal-coverage"
dependencies = [
]

args = [
]

# Keep representative multi-step thermal paths under coverage while giving
# each coverage process ample headroom below Kit's fixed 300-second limit.
pythonTests.include = [
    "campfire.app.tests.test_scene.TestScene.test_layered_panel_preserves_mass_and_heats_through_five_plies",
    "campfire.app.tests.test_scene.TestScene.test_parallel_arrhenius_pathways_compete_and_conserve_product_mass",
    "campfire.app.tests.test_scene.TestScene.test_temperature_dependent_heat_capacity_is_normalized_and_clamped",
]


[[test]]
name = "wet-kindling-coverage"
dependencies = [
]

args = [
]

# Keep the long wet/dry ignition comparison under coverage without allowing
# unrelated thermal cases to consume its fixed 300-second process budget.
pythonTests.include = [
    "campfire.app.tests.test_scene.TestScene.test_wet_kindling_evaporates_and_ignites_after_dry_kindling",
]


[[test]]
name = "collapse-coverage"
dependencies = [
]

args = [
]

# Keep the collapse integration scenario coverage-instrumented in its own
# process so it retains margin below Kit's fixed 300-second limit.
pythonTests.include = [
    "campfire.app.tests.test_scene.TestScene.test_collapse_scenario_releases_and_reignites_with_mass_balance",
]


[[test]]
name = "fixed-reference"
dependencies = [
]

args = [
]

pyCoverageEnabled = false
# Coverage expands this deterministic reference simulation past Kit's fixed
# process limit; shorter layered thermal checks retain representative coverage.
pythonTests.include = [
    "campfire.app.tests.test_scene.TestScene.test_nist_reference_is_fixed_and_higher_flux_ignites_first",
]


[[test]]
name = "air-feedback"
dependencies = [
]

args = [
]

pyCoverageEnabled = false
# The full 180-second coupled scenario remains an exact behavioral regression;
# shorter air-supply, oxygen, and heat-feedback tests stay coverage-instrumented.
pythonTests.include = [
    "campfire.app.tests.test_scene.TestScene.test_log_cabin_air_feedback_ignites_before_dense_stack",
]


[[test]]
name = "numerical"
dependencies = [
]

args = [
]

pyCoverageEnabled = false
# These deterministic long-running numerical checks are verified separately
# because coverage instrumentation expands them beyond Kit's 300-second limit.
pythonTests.include = [
    "campfire.app.tests.test_scene.TestScene.test_nist_grid_search_improves_baseline_without_hiding_error",
    "campfire.app.tests.test_scene.TestScene.test_numpy_backend_matches_python_for_complete_steps",
]
